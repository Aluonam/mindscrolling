<title>MindScrolling</title>

-->

    color: #7D89A6;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12px;
    letter-spacing: .12em;
    text-transform: uppercase;
  }
  a { color: #5AB4FF; }
</style>
