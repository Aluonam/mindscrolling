<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0D14">
<title>MindScrolling</title>

<!-- Instalable en la pantalla de inicio y legible sin conexión. -->
<link rel="manifest" href="manifest.json">
<!-- El SVG lo prefieren los navegadores que lo entienden, porque escala solo; el
     PNG queda de respaldo para los que no. -->
<link rel="icon" href="iconos/marca.svg" type="image/svg+xml">
<link rel="icon" href="iconos/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="iconos/icono-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<!-- Atomic design. El orden es la cascada: lo de abajo puede anular lo de
     arriba, nunca al revés. Enlaces sueltos y no @import: se descargan en
     paralelo y no hay paso de construcción. -->

<!-- Átomos -->
<link rel="stylesheet" href="estilos/atomos/variables.css">
<link rel="stylesheet" href="estilos/atomos/base.css">
<link rel="stylesheet" href="estilos/atomos/grano.css">
<link rel="stylesheet" href="estilos/atomos/boton.css">
<link rel="stylesheet" href="estilos/atomos/enlace.css">
<link rel="stylesheet" href="estilos/atomos/palabra.css">
<link rel="stylesheet" href="estilos/atomos/separador.css">

<!-- Moléculas -->
<link rel="stylesheet" href="estilos/moleculas/procedencia.css">
<link rel="stylesheet" href="estilos/moleculas/destilado.css">
<link rel="stylesheet" href="estilos/moleculas/pie.css">
<link rel="stylesheet" href="estilos/moleculas/segmentos.css">
<link rel="stylesheet" href="estilos/moleculas/fila.css">
<link rel="stylesheet" href="estilos/moleculas/guardado.css">
<link rel="stylesheet" href="estilos/moleculas/filtros.css">
<link rel="stylesheet" href="estilos/moleculas/letras.css">
<link rel="stylesheet" href="estilos/moleculas/aviso.css">
<link rel="stylesheet" href="estilos/moleculas/instalacion.css">

<!-- Organismos -->
<link rel="stylesheet" href="estilos/organismos/cabecera.css">
<link rel="stylesheet" href="estilos/organismos/pieza.css">
<link rel="stylesheet" href="estilos/organismos/velo.css">
<link rel="stylesheet" href="estilos/organismos/indice.css">
<link rel="stylesheet" href="estilos/organismos/detalle.css">
<link rel="stylesheet" href="estilos/organismos/acciones.css">
<link rel="stylesheet" href="estilos/organismos/cierre.css">
<link rel="stylesheet" href="estilos/organismos/vacio.css">

<!-- Plantilla -->
<link rel="stylesheet" href="estilos/plantillas/lector.css">
</head>
<body>

<div class="grano" aria-hidden="true"></div>

<header class="cabecera" id="cabecera" hidden>
  <div class="segmentos" id="segmentos"></div>
  <div class="marca">
    <!-- La marca reducida: solo el brote. A 20 px el anillo y la flecha se
         emborronan hasta ser una mancha, y lo que identifica a la marca son las
         dos hojas sobre la semilla. El icono entero vive en iconos/marca.svg. -->
    <svg class="sello" viewBox="176 200 160 210" aria-hidden="true" focusable="false">
      <g fill="#FFB454">
        <ellipse cx="256" cy="352" rx="46" ry="52"/>
        <rect x="245" y="262" width="22" height="96" rx="11"/>
        <path d="M250 278 C 208 276 188 252 186 218 C 224 220 246 244 250 278 Z"/>
        <path d="M262 278 C 304 276 324 252 326 218 C 288 220 266 244 262 278 Z"/>
      </g>
    </svg>
    <b>MindScrolling</b>
    <span class="fecha-edicion" id="fechaEdicion"></span>
    <button class="ritmo" id="sonido" type="button" aria-pressed="false" aria-label="Ondas de fondo">♪</button>
    <button class="ritmo" id="ritmo" type="button" aria-label="Cambiar velocidad de lectura">1,0×</button>
    <button class="ritmo" id="abrirIndice" type="button" aria-expanded="false" aria-label="Ver la edición del día">☰&nbsp;<span id="contadorBoton">0</span></button>
  </div>
</header>

<div class="velo" id="velo"></div>

<aside class="indice" id="indice" aria-hidden="true" aria-label="Edición del día">
  <div class="indice-cabecera">
    <div class="indice-titulo">
      <b>Edición del día</b>
      <span id="resumenUso">0 s de uso · 0 leídas</span>
    </div>
    <button class="cerrar" id="cerrarIndice" type="button" aria-label="Cerrar">×</button>
  </div>
  <div class="pestanas" id="pestanas" role="group" aria-label="Qué se ve en el panel">
    <button class="chip activa" id="pestanaEdicion" type="button" aria-pressed="true">Edición</button>
    <button class="chip" id="pestanaGuardados" type="button" aria-pressed="false">Guardados&nbsp;<span id="contadorGuardados">0</span></button>
  </div>

  <div class="filtros" id="filtros" role="group" aria-label="Filtrar por ámbito"></div>

  <div class="listado" id="listado"></div>
  <div class="guardados" id="guardados" hidden></div>

  <div class="ajustes">
    <div class="ajustes-titulo">Ajustes · tipo de letra</div>
    <div class="letras" id="letras"></div>

    <div class="ajustes-titulo instalacion-titulo">Instalar en el móvil o en el ordenador</div>
    <div class="instalacion" id="instalacion"></div>
  </div>
</aside>

<section class="detalle" id="detalle" aria-hidden="true" aria-label="Pieza ampliada">
  <div class="detalle-cabecera">
    <div class="detalle-fuente">
      <b>Del original</b>
      <span id="detalleFuente"></span>
    </div>
    <button class="cerrar" id="cerrarDetalle" type="button" aria-label="Cerrar">×</button>
  </div>
  <div class="detalle-cuerpo" id="detalleCuerpo">
    <h2 class="detalle-titulo" id="detalleTitulo"></h2>
    <p id="detalleTexto"></p>
  </div>
  <div class="detalle-pie">
    <a class="original" id="detalleEnlace" href="#" target="_blank" rel="noopener">Abrir el original</a>
  </div>
</section>

<main class="carril" id="carril"></main>

<div class="aviso" id="aviso" role="status" aria-live="polite"></div>

<nav class="acciones" id="acciones" aria-label="Acciones sobre la pieza actual" hidden>
  <button class="accion" id="compartir" type="button" aria-label="Compartir el original">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M12 15V3m0 0L8 7m4-4 4 4"/>
      <path d="M4 13v6a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-6"/>
    </svg>
  </button>
  <button class="accion" id="guardar" type="button" aria-pressed="false" aria-label="Guardar el original">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M6 3.5h12v17l-6-4.2-6 4.2z"/>
    </svg>
  </button>
</nav>


<script type="module" src="guion/lector.js"></script>
</body>
</html>
