<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0D14">
<title>MindScrolling</title>
<link rel="stylesheet" href="estilos.css">
</head>
<body>

<div class="grano" aria-hidden="true"></div>

<header class="cabecera" id="cabecera" hidden>
  <div class="segmentos" id="segmentos"></div>
  <div class="marca">
    <b>MindScrolling</b>
    <span class="fecha-edicion" id="fechaEdicion"></span>
    <button class="ritmo" id="sonido" type="button" aria-pressed="false" aria-label="Ondas de fondo">♪</button>
    <button class="ritmo" id="ritmo" type="button" aria-label="Cambiar velocidad de lectura">1,0×</button>
    <button class="ritmo" id="abrirIndice" type="button" aria-expanded="false" aria-label="Ver la edición del día">☰&nbsp;<span id="contadorBoton">0</span></button>
  </div>
</header>

<div class="velo" id="velo"></div>

<aside class="indice" id="indice" aria-hidden="true" aria-label="Edición del día">
  <div class="indice-cabecera">
    <div class="indice-titulo">
      <b>Edición del día</b>
      <span id="resumenUso">0 s de uso · 0 leídas</span>
    </div>
    <button class="cerrar" id="cerrarIndice" type="button" aria-label="Cerrar">×</button>
  </div>
  <div class="filtros" id="filtros" role="group" aria-label="Filtrar por ámbito"></div>

  <div class="listado" id="listado"></div>

  <div class="ajustes">
    <div class="ajustes-titulo">Ajustes · tipo de letra</div>
    <div class="letras" id="letras"></div>
  </div>
</aside>

<section class="detalle" id="detalle" aria-hidden="true" aria-label="Pieza ampliada">
  <div class="detalle-cabecera">
    <div class="detalle-fuente">
      <b>Del original</b>
      <span id="detalleFuente"></span>
    </div>
    <button class="cerrar" id="cerrarDetalle" type="button" aria-label="Cerrar">×</button>
  </div>
  <div class="detalle-cuerpo" id="detalleCuerpo">
    <h2 class="detalle-titulo" id="detalleTitulo"></h2>
    <p id="detalleTexto"></p>
  </div>
  <div class="detalle-pie">
    <a class="original" id="detalleEnlace" href="#" target="_blank" rel="noopener">Abrir el original</a>
  </div>
</section>

<main class="carril" id="carril"></main>

<div class="aviso" id="aviso" role="status" aria-live="polite"></div>

<nav class="valoracion" id="valoracion" aria-label="Acciones sobre la pieza actual" hidden>
  <button class="voto" id="votoNo" type="button">Poco relevante</button>
  <button class="voto" id="votoSi" type="button">Muy relevante</button>
  <button class="voto enviar" id="enviar" type="button">Enviar</button>
</nav>


<script type="module" src="lector.js"></script>
</body>
</html>
